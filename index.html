<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hộp quà</title>

    <style>

        * {
            box-sizing: border-box;
        }

        /* =====================================
           BODY
        ===================================== */

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at center,
                    #211a3b 0%,
                    #111 55%,
                    #080808 100%
                );

            font-family: Arial, sans-serif;
        }


        /* =====================================
           CREDIT
        ===================================== */

        .credit {
            position: fixed;

            top: 12px;
            left: 15px;

            color: #888;
            font-size: 12px;

            opacity: 0.8;

            z-index: 1000;
        }


        /* =====================================
           KHU VỰC HỘP QUÀ
        ===================================== */

        .gift-container {

            position: relative;

            width: 300px;
            height: 350px;

            display: flex;
            justify-content: center;
            align-items: center;

            cursor: pointer;

            perspective: 800px;

            /* HẠ HỘP QUÀ XUỐNG */
            transform: translateY(80px);
        }


        /* =====================================
           VÒNG SÁNG DƯỚI HỘP
        ===================================== */

        .glow {

            position: absolute;

            bottom: 30px;

            width: 230px;
            height: 45px;

            background: #8e6cff;

            border-radius: 50%;

            filter: blur(25px);

            opacity: 0.35;

            transition: 0.5s;

            z-index: 0;
        }


        .gift-container:hover .glow {

            opacity: 0.65;

            transform: scale(1.15);
        }


        /* =====================================
           ÁNH SÁNG TRONG HỘP
        ===================================== */

        .light {

            position: absolute;

            left: 100px;
            bottom: 145px;

            width: 100px;
            height: 80px;

            background: #ffd86b;

            border-radius: 50%;

            filter: blur(25px);

            opacity: 0;

            z-index: 1;

            transition: 0.5s;
        }


        /* =====================================
           DÒNG CHỮ BAY RA
           NẰM SAU HỘP
        ===================================== */

        .money-message {

            position: absolute;

            left: 50%;

            bottom: 125px;

            transform:
                translate(-50%, 0)
                scale(0.3);

            white-space: nowrap;

            color: #ffd86b;

            font-size: 25px;

            font-weight: bold;

            text-shadow:
                0 0 5px #ffd86b,
                0 0 15px #ff9f00,
                0 0 30px #ff7b00;

            opacity: 0;

            pointer-events: none;

            /*
                QUAN TRỌNG:
                Chữ nằm SAU hộp
            */
            z-index: 2;
        }


        /* =====================================
           HỘP QUÀ
        ===================================== */

        .gift {

            position: relative;

            width: 170px;
            height: 140px;

            transform-style: preserve-3d;

            transition: transform 0.4s ease;

            /*
                Hộp nằm TRƯỚC dòng chữ
            */
            z-index: 5;
        }


        .gift-container:hover .gift {

            transform:
                translateY(-5px)
                scale(1.04);
        }


        /* =====================================
           THÂN HỘP
        ===================================== */

        .box {

            position: absolute;

            bottom: 20px;
            left: 10px;

            width: 150px;
            height: 110px;

            background:
                linear-gradient(
                    135deg,
                    #8064ff,
                    #5638c9
                );

            border-radius: 5px;

            box-shadow:
                inset 0 0 20px
                rgba(255,255,255,0.15),

                0 15px 30px
                rgba(0,0,0,0.5);
        }


        /* =====================================
           RUY-BĂNG DỌC
        ===================================== */

        .ribbon-vertical {

            position: absolute;

            left: 65px;
            bottom: 20px;

            width: 40px;
            height: 110px;

            background:
                linear-gradient(
                    90deg,
                    #ff4f9a,
                    #ff75b0,
                    #ff4f9a
                );

            z-index: 2;
        }


        /* =====================================
           RUY-BĂNG NGANG
        ===================================== */

        .ribbon-horizontal {

            position: absolute;

            left: 10px;
            bottom: 75px;

            width: 150px;
            height: 30px;

            background:
                linear-gradient(
                    180deg,
                    #ff75b0,
                    #ff3f91
                );

            z-index: 4;
        }


        /* =====================================
           NẮP HỘP
        ===================================== */

        .lid {

            position: absolute;

            left: 0;
            bottom: 115px;

            width: 170px;
            height: 38px;

            background:
                linear-gradient(
                    135deg,
                    #9b83ff,
                    #684de0
                );

            border-radius: 6px;

            z-index: 10;

            transform-origin: bottom center;

            transition:
                transform 0.8s
                cubic-bezier(.17,.67,.24,1.2);
        }


        /* =====================================
           RUY-BĂNG TRÊN NẮP
        ===================================== */

        .ribbon-lid {

            position: absolute;

            left: 65px;
            top: 0;

            width: 40px;
            height: 38px;

            background: #ff5ba3;
        }


        /* =====================================
           NƠ
        ===================================== */

        .bow {

            position: absolute;

            top: -35px;
            left: 52px;

            width: 65px;
            height: 40px;

            z-index: 12;

            transition:
                transform 0.8s ease;
        }


        .bow-left,
        .bow-right {

            position: absolute;

            width: 45px;
            height: 30px;

            background:
                linear-gradient(
                    135deg,
                    #ff72b2,
                    #ff318d
                );

            border-radius:
                50% 50% 10% 50%;
        }


        .bow-left {

            left: -12px;

            transform: rotate(25deg);
        }


        .bow-right {

            right: -12px;

            transform: rotate(-25deg);
        }


        .bow-center {

            position: absolute;

            left: 23px;
            top: 8px;

            width: 22px;
            height: 22px;

            background: #ff3d91;

            border-radius: 50%;

            box-shadow:
                0 0 10px #ff4f9a;
        }


        /* =====================================
           HỘP MỞ
        ===================================== */

        .gift-container.open .lid {

            transform:
                translateY(-90px)
                rotate(-8deg);
        }


        .gift-container.open .bow {

            transform:
                translateY(-90px)
                rotate(-8deg);
        }


        .gift-container.open .light {

            opacity: 1;

            animation:
                lightPulse 1s
                infinite alternate;
        }


        .gift-container.open .glow {

            opacity: 0.9;

            transform: scale(1.3);
        }


        @keyframes lightPulse {

            from {
                transform: scale(0.8);
                opacity: 0.6;
            }

            to {
                transform: scale(1.3);
                opacity: 1;
            }
        }


        /* =====================================
           ANIMATION CHỮ BAY RA
        ===================================== */

        .gift-container.open .money-message {

            animation:
                moneyFly 1.8s
                cubic-bezier(.17,.67,.24,1.2)
                forwards;
        }


        @keyframes moneyFly {

            0% {

                opacity: 0;

                transform:
                    translate(-50%, 20px)
                    scale(0.3)
                    rotate(-8deg);
            }


            20% {

                opacity: 1;

                transform:
                    translate(-50%, 0)
                    scale(0.7)
                    rotate(3deg);
            }


            45% {

                opacity: 1;

                transform:
                    translate(-50%, -80px)
                    scale(1.15)
                    rotate(-3deg);
            }


            70% {

                opacity: 1;

                transform:
                    translate(-50%, -160px)
                    scale(1.05)
                    rotate(2deg);
            }


            100% {

                opacity: 0;

                transform:
                    translate(-50%, -260px)
                    scale(0.85)
                    rotate(5deg);
            }
        }


        /* =====================================
           MƯA CONFETTI
        ===================================== */

        .rain-confetti {

            position: fixed;

            top: -30px;

            width: 9px;
            height: 16px;

            opacity: 0;

            pointer-events: none;

            z-index: 900;
        }


        .rain-confetti.falling {

            animation:
                fall linear forwards;
        }


        @keyframes fall {

            0% {

                transform:
                    translateY(-30px)
                    rotate(0deg);

                opacity: 1;
            }


            100% {

                transform:
                    translateY(110vh)
                    rotate(720deg);

                opacity: 0;
            }
        }


        /* =====================================
           CHỮ HƯỚNG DẪN
        ===================================== */

        .text {

            position: absolute;

            bottom: 0;

            color: #ddd;

            font-size: 14px;

            opacity: 0.7;

            transition: 0.3s;

            white-space: nowrap;

            z-index: 20;
        }


        .gift-container:hover .text {

            color: white;

            opacity: 1;
        }


        .gift-container.open .text {

            color: #ffd86b;

            text-shadow:
                0 0 10px #ffd86b;
        }


        /* =====================================
           RUNG KHI MỞ
        ===================================== */

        .gift-container.open .gift {

            animation:
                giftShake 0.6s ease;
        }


        @keyframes giftShake {

            0% {
                transform: scale(1);
            }

            30% {
                transform:
                    scale(1.08)
                    rotate(-2deg);
            }

            60% {
                transform:
                    scale(1.05)
                    rotate(2deg);
            }

            100% {
                transform:
                    scale(1);
            }
        }

    </style>
</head>


<body>


    <!-- =====================================
         CREDIT
    ===================================== -->

    <div class="credit">
        Nguoi Thuc Vat
    </div>


    <!-- =====================================
         HỘP QUÀ
    ===================================== -->

    <div
        class="gift-container"
        id="gift"
        onclick="openGift()"
    >


        <!-- Vòng sáng -->

        <div class="glow"></div>


        <!-- Ánh sáng trong hộp -->

        <div class="light"></div>


        <!-- =================================
             DÒNG CHỮ

             Đặt trước trong HTML nhưng
             z-index thấp hơn hộp
        ================================== -->

        <div
            class="money-message"
            id="moneyMessage"
        >
            💸 Bạn đã mất một tỷ =))
        </div>


        <!-- =================================
             HỘP
        ================================== -->

        <div class="gift">


            <!-- Thân hộp -->

            <div class="box"></div>


            <!-- Ruy-băng dọc -->

            <div class="ribbon-vertical"></div>


            <!-- Ruy-băng ngang -->

            <div class="ribbon-horizontal"></div>


            <!-- Nắp -->

            <div class="lid">

                <div class="ribbon-lid"></div>

            </div>


            <!-- Nơ -->

            <div class="bow">

                <div class="bow-left"></div>

                <div class="bow-right"></div>

                <div class="bow-center"></div>

            </div>


        </div>


        <!-- =================================
             CHỮ HƯỚNG DẪN
        ================================== -->

        <div
            class="text"
            id="text"
        >
            🎁 Bấm vào hộp quà
        </div>


    </div>


    <!-- =====================================
         JAVASCRIPT
    ===================================== -->

    <script>

        let opened = false;


        /* =====================================
           MỞ / ĐÓNG HỘP
        ===================================== */

        function openGift() {

            const gift =
                document.getElementById("gift");

            const text =
                document.getElementById("text");


            if (!opened) {

                /* Mở hộp */

                gift.classList.add("open");


                /* Đổi chữ bên dưới */

                text.innerHTML =
                    "💸 Chúc mừng =))";


                opened = true;


                /* Mưa confetti */

                createConfetti();

            }

            else {

                /* Đóng hộp */

                gift.classList.remove("open");


                text.innerHTML =
                    "🎁 Bấm vào hộp quà";


                opened = false;

            }

        }


        /* =====================================
           TẠO CONFETTI
        ===================================== */

        function createConfetti() {

            const colors = [

                "#ff4f9a",
                "#ffd84d",
                "#5ee7ff",
                "#a878ff",
                "#ff914d",
                "#7dff82",
                "#ffffff"

            ];


            /* Tạo 100 mảnh */

            for (let i = 0; i < 100; i++) {

                const confetti =
                    document.createElement("div");


                confetti.classList.add(
                    "rain-confetti"
                );


                /* Vị trí ngang */

                confetti.style.left =
                    Math.random() * 100 + "vw";


                /* Màu */

                confetti.style.background =
                    colors[
                        Math.floor(
                            Math.random() *
                            colors.length
                        )
                    ];


                /* Kích thước */

                const width =
                    Math.random() * 7 + 5;

                const height =
                    Math.random() * 12 + 8;


                confetti.style.width =
                    width + "px";

                confetti.style.height =
                    height + "px";


                /* Tốc độ */

                const duration =
                    Math.random() * 3 + 2;


                confetti.style.animationDuration =
                    duration + "s";


                /* Delay */

                confetti.style.animationDelay =
                    Math.random() * 1.2 + "s";


                /* Góc xoay */

                confetti.style.transform =
                    "rotate(" +
                    Math.random() * 360 +
                    "deg)";


                document.body.appendChild(
                    confetti
                );


                /* Bắt đầu animation */

                requestAnimationFrame(() => {

                    confetti.classList.add(
                        "falling"
                    );

                });


                /* Xóa */

                setTimeout(() => {

                    confetti.remove();

                }, 6000);

            }

        }

    </script>


</body>
</html>
